[package]
name = "emerge_aura"
version = "0.1.0"
edition = "2021"
description = "AURA (Adaptive Unstructured Refinement Algorithm): local tetrahedral refinement for EMerge"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "_aura"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.22", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
